name: Build and Release PS5 Payload

on:
  # 方式 1：推送以 v 开头的版本标签时自动触发（如 v1.0.0）
  push:
    tags:
      - 'v*'
  # 方式 2：在 GitHub 网页端手动发布 Release 时自动触发
  release:
    types: [published]
  # 方式 3：支持在 Actions 页面手动点击运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar xz-utils make
          # 下载并解压最新版 ps5-payload-sdk 到默认目录 /opt/ps5-payload-sdk
          SDK_URL=$(curl -s https://github.com | grep "browser_download_url.*tar.xz" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading SDK from: $SDK_URL"
          wget -qO /tmp/ps5-payload-sdk.tar.xz "$SDK_URL"
          sudo mkdir -p /opt/ps5-payload-sdk
          sudo tar -xJf /tmp/ps5-payload-sdk.tar.xz -C /opt/ps5-payload-sdk --strip-components=1

      - name: Build Payload
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make clean && make

      - name: Upload Build Artifacts (for workflow_dispatch testing)
        uses: actions/upload-artifact@v4
        with:
          name: ps5-fan-control-build
          path: |
            ps5-fan-control.elf
            fan_control.ini

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ps5-fan-control.elf
            fan_control.ini
          generate_release_notes: false
