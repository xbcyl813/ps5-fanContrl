name: Build and Release PS5 Payload

on:
  # 方式 1：推送以 v 开头的版本标签时自动触发（如 v1.0.0）
  push:
    tags:
      - 'v*'
  # 方式 2：在 GitHub 网页端手动发布 Release 时自动触发
  release:
    types: [published]
  # 方式 3：支持在 Actions 页面手动点击运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PS5 Payload SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip make clang lld
          # 使用官方固定的最新版 zip 直链下载并解压到 /opt/ps5-payload-sdk
          wget -qO /tmp/ps5-payload-sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          sudo unzip -q -o /tmp/ps5-payload-sdk.zip -d /opt

      - name: Build Payload
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make clean && make

      - name: Upload Build Artifacts (for workflow_dispatch testing)
        uses: actions/upload-artifact@v4
        with:
          name: ps5-fan-control-build
          path: |
            ps5-fan-control.elf
            fan_control.ini

      - name: Attach Binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ps5-fan-control.elf
            fan_control.ini
          generate_release_notes: false
