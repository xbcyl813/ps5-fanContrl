# ==============================================================================
# PS5 Fan Control Configuration File / PS5 风扇控制配置文件
# ==============================================================================
# Priority / 读取优先级:
#   1. /data/fan_control.ini (Internal Storage / 主机内置存储 - Highest Priority / 最高优先级)
#   2. /mnt/usb0/fan_control.ini ~ /mnt/usb7/fan_control.ini (USB Drive / U盘根目录)
# ==============================================================================

# Target temperature threshold in Celsius (Range: 30 - 90, Default: 80)
# 目标温度阈值，单位摄氏度（有效范围：30 - 90，默认值：80）
target_temperature=80

# Polling & guard refresh interval in seconds (Range: 1 - 3600, Default: 15)
# 状态轮询与刷新检测的时间间隔，单位秒（有效范围：1 - 3600，默认值：15）
interval=15

# Show PS5 system notification when target temperature is applied/re-applied
# 当目标温度首次生效或系统重置后重新覆写时，是否弹出系统提示
# (1 = Enable / 开启, 0 = Disable / 关闭, Default / 默认值: 1)
show_status=1
